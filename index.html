<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นายธนาคารประจำบ้าน | ninethanakarn.com</title>
    <meta name="description" content="ปิดหนี้ก่อนยื่นกู้ - รวมหนี้บัตรเครดิต - ที่ปรึกษาสินเชื่อบ้าน">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 24px;
            font-weight: 500;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        .tagline {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .tools {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
        }
        
        .tools h2 {
            font-size: 16px;
            margin-bottom: 16px;
            opacity: 0.9;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .tool-btn {
            display: inline-block;
            background: #fff;
            color: #1e3a8a;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin: 4px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .tool-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .contact {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .contact-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .footer {
            margin-top: 32px;
            font-size: 13px;
            opacity: 0.7;
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 26px; }
            .tagline { font-size: 16px; }
            .container { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">🏠 Mr. Home Banker</div>
        
        <h1>นายธนาคารประจำบ้าน</h1>
        <p class="tagline">
            ปิดหนี้ก่อนยื่นกู้<br>
            รวมหนี้บัตรเครดิต
        </p>
        
        <div class="tools">
            <h2>เครื่องมือฟรี</h2>
            <a href="https://ninethanakarn.github.io/loan-app/" class="tool-btn">
                💰 คำนวณสินเชื่อบ้าน
            </a>
        </div>
        
        <div class="contact">
            <a href="https://line.me/R/ti/p/@ninethanakarn" class="contact-item">
                💬 LINE: @ninethanakarn
            </a>
            <a href="tel:0994195515" class="contact-item">
                📞 099-419-5515
            </a>
            <a href="tel:023340940" class="contact-item">
                ☎️ 02-334-0940 (จ.-ส. 9:00-17:00)
            </a>
        </div>
        
        <div class="footer">
            🚧 เว็บไซต์อยู่ระหว่างพัฒนา<br>
            บริษัท ทัช เรียลเอสเตท จำกัด
        </div>
    </div>
</body>
</html>
